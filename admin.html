<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>管理后台 · 葵花码</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <link rel="stylesheet" href="/src/styles/console.css" />
    <script defer src="/src/ui/api.js"></script>
    <script defer src="/src/ui/admin-tabs.js"></script>
    <script defer src="/src/ui/security.js"></script>
    <script defer src="/src/ui/account.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/"><span class="brand-mark">✳</span>葵花码</a>
      <nav>
        <a href="/">生成器</a><a href="/history">历史记录</a
        ><a id="admin-link" href="/admin" hidden>管理后台</a><span id="current-user"></span
        ><button id="logout" type="button" class="inline-button">退出</button>
      </nav>
    </header>
    <main class="console-main">
      <div class="page-heading">
        <div>
          <h1>管理后台</h1>
        </div>
      </div>
      <p id="page-message" class="notice-error" role="alert" hidden></p>
      <div class="admin-tabs" role="tablist" aria-label="后台管理">
        <button
          id="admin-tab-accounts"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="admin-panel-accounts"
          data-admin-tab="accounts"
        >
          账号与用量
        </button>
        <button
          id="admin-tab-invites"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="admin-panel-invites"
          data-admin-tab="invites"
          tabindex="-1"
        >
          邀请管理
        </button>
        <button
          id="admin-tab-support"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="admin-panel-support"
          data-admin-tab="support"
          tabindex="-1"
        >
          联系支持
        </button>
      </div>
      <div
        id="admin-panel-accounts"
        role="tabpanel"
        aria-labelledby="admin-tab-accounts"
        tabindex="0"
      >
        <p id="accounts-message" class="notice-error" role="alert" hidden></p>
        <section class="panel">
          <h2>账号与用量</h2>
          <form id="user-filter" class="filter-row">
            <label>账号<input id="user-query" placeholder="搜索账号" maxlength="32" /></label
            ><label>开始日期<input id="date-from" type="date" /></label
            ><label>结束日期<input id="date-to" type="date" /></label
            ><button class="primary" type="submit">查询</button>
          </form>
          <div class="table-scroll">
            <table id="users-table">
              <thead>
                <tr>
                  <th>账号</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>累计生成</th>
                  <th>今日</th>
                  <th>所选时段</th>
                  <th>注册时间</th>
                  <th>最近登录</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="users-prev">上一页</button><span id="users-page"></span
            ><button id="users-next">下一页</button>
          </div>
          <p class="field-hint">
            按服务端成功生成次数统计，下载、复制和外观调整不重复计数；日期按北京时间。
          </p>
        </section>
      </div>
      <div
        id="admin-panel-invites"
        role="tabpanel"
        aria-labelledby="admin-tab-invites"
        tabindex="0"
        hidden
      >
        <p id="invites-message" class="notice-error" role="alert" hidden></p>
        <section class="panel">
          <h2>生成邀请</h2>
          <form id="invite-form" class="filter-row">
            <label
              >数量<input
                id="invite-count"
                type="number"
                min="1"
                max="50"
                value="1"
                required /></label
            ><label
              >有效天数<input
                id="invite-days"
                type="number"
                min="1"
                max="90"
                value="7"
                required /></label
            ><label class="grow"
              >备注<input
                id="invite-note"
                maxlength="100"
                placeholder="例如：第一批体验用户" /></label
            ><button class="primary" type="submit">生成邀请</button>
          </form>
          <div id="invite-result" hidden>
            <p class="field-hint">
              请现在复制并保存链接，离开页面后无法再次查看。每条链接只能注册一次。
            </p>
            <textarea id="invite-links" rows="4" readonly></textarea
            ><button id="copy-invites" type="button">复制全部链接</button>
          </div>
        </section>
        <section class="panel">
          <h2>邀请记录</h2>
          <div class="table-scroll">
            <table id="invites-table">
              <thead>
                <tr>
                  <th>备注</th>
                  <th>状态</th>
                  <th>注册账号</th>
                  <th>到期时间</th>
                  <th>使用时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="invites-body"></tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="invites-prev">上一页</button><span id="invites-page"></span
            ><button id="invites-next">下一页</button>
          </div>
        </section>
      </div>
      <div
        id="admin-panel-support"
        role="tabpanel"
        aria-labelledby="admin-tab-support"
        tabindex="0"
        hidden
      >
        <section class="panel" id="security-settings">
          <h2>联系支持</h2>
          <p id="security-message" role="status"></p>
          <form id="support-form" class="filter-row">
            <label
              >联系方式<input
                id="support-contact"
                maxlength="200"
                placeholder="微信号、邮箱或联系说明" /></label
            ><label
              >客服链接（可选）<input
                id="support-url"
                maxlength="500"
                placeholder="https://… 或 mailto:…" /></label
            ><button type="submit">保存联系方式</button>
          </form>
        </section>
      </div>
    </main>
    <dialog id="reset-dialog">
      <form>
        <h2 id="reset-target">重置密码</h2>
        <p>核实用户身份后生成一次性链接，30 分钟有效。重新生成会使旧链接失效。</p>
        <label for="reset-admin-password">你的管理员密码</label
        ><input
          id="reset-admin-password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p id="reset-error" role="alert"></p>
        <div class="row-actions">
          <button type="button" onclick="this.closest('dialog').close()">关闭</button
          ><button type="submit">生成重置链接</button>
        </div>
      </form>
      <div id="reset-result" hidden>
        <textarea id="reset-link" rows="3" readonly></textarea
        ><button id="reset-copy" type="button">复制重置链接</button>
      </div>
    </dialog>
  </body>
</html>
